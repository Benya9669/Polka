name: Build Polka image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Linux image
        run: docker build --platform linux/amd64 -t polka:ci .
      - name: Check application and converter
        run: docker run --rm polka:ci sh -ec 'test -s /app/web/index.html && python -c "import app.main" && ebook-convert --version'
      - name: Publish to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=("sha-${GITHUB_SHA}")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=(latest)
          else
            tags+=("$GITHUB_REF_NAME")
          fi
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "${tags[@]}"; do
            docker tag polka:ci "$image:$tag"
            docker push "$image:$tag"
          done
